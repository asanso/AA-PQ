[package]
name = "lean_sphincs_wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "WebAssembly exports of leanVM's lean_sphincs for the NiceTry Daisugi wallet signer"

[lib]
crate-type = ["cdylib"]

[dependencies]
# leanEthereum/leanVM at the revision Nethermind's lean-bindings pin for EIP-8288 scheme 0x10 on Daisugi devnet-1.
lean_sphincs = { git = "https://github.com/leanEthereum/leanVM", rev = "f7ba4999ae523b94c8d0969b32762c3effea4cbd" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[workspace]
