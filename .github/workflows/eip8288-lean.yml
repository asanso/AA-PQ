name: EIP-8288 Lighthouse series

# Separate from the portal pipeline, so a failing upstream archive download cannot block portal releases.
on:
  push:
    branches: [dev, staging, main]
    paths:
      - aggregation/frames/consensus/eip8288-lean/**
      - .github/workflows/eip8288-lean.yml
  pull_request:
    branches: [dev, staging, main]
    paths:
      - aggregation/frames/consensus/eip8288-lean/**
      - .github/workflows/eip8288-lean.yml

permissions:
  contents: read

jobs:
  series:
    name: Lighthouse patch series
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run the package tests
        run: python3 -m unittest discover -s aggregation/frames/consensus/eip8288-lean -p 'test_*.py' -v
      - name: Apply the Lighthouse patch series to the pinned upstream archive
        run: |
          package=aggregation/frames/consensus/eip8288-lean
          revision=$(jq -r .lighthouse.revision "$package/sources.lock.json")
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lighthouse.tar.gz" "https://github.com/sigp/lighthouse/archive/$revision.tar.gz"
          python3 "$package/apply.py" lighthouse "$RUNNER_TEMP/lighthouse.tar.gz" "$RUNNER_TEMP/lighthouse"
