<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set up NiceTry</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link href="/fonts.css" rel="stylesheet">
  <!-- Pre-paint theme (see popup.html). Keeps onboarding consistent with
       the user's chosen stone/slate theme without a flash. -->
  <script>try{var t=localStorage.getItem('nt_theme');document.documentElement.dataset.theme=(t==='slate'||t==='stone')?t:'stone';}catch(e){document.documentElement.dataset.theme='stone';}</script>
</head>
<body class="onboarding-surface min-h-screen bg-bg-primary text-text-primary font-sans antialiased">
  <div id="app"></div>
  <script type="module" src="/src/onboarding/main.jsx"></script>
</body>
</html>
